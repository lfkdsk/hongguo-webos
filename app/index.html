<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>红果短剧</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▶</span><span>红果短剧</span></div>
      <div class="search"><input id="search-input" type="search" placeholder="搜索短剧" aria-label="搜索短剧"><button id="search-button">搜索</button></div>
      <span id="status">正在连接电视服务…</span>
    </header>
    <main>
      <section id="home-screen" class="screen">
        <h1 id="home-title">推荐短剧</h1>
        <div id="catalog" class="catalog"></div>
      </section>
      <section id="series-screen" class="screen hidden">
        <div class="series-head"><button id="series-back" class="back">← 返回</button><div><h1 id="series-title"></h1><p id="series-description"></p></div></div>
        <div id="episodes" class="episodes"></div>
      </section>
      <section id="player-screen" class="screen hidden">
        <div class="player-head"><button id="player-back" class="back">← 选集</button><div><h1 id="player-title"></h1><p id="player-episode"></p></div><span id="player-message"></span></div>
        <div class="video-wrap"><video id="video" playsinline></video><div id="video-loading" class="video-loading">准备视频…</div></div>
        <div class="player-controls"><button id="seek-back">−15 秒</button><button id="toggle-play">暂停</button><button id="seek-forward">+15 秒</button><button id="next-episode">下一集</button><span id="clock">00:00 / 00:00</span></div>
      </section>
    </main>
    <div id="toast" role="status"></div>
  </div>
  <script src="vendor/webOSTV.js"></script>
  <script src="app.js"></script>
</body>
</html>
